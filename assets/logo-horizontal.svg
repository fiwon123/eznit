<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(20, 20)">
    <rect width="160" height="160" rx="36" fill="url(#bg)"/>
    
    <g transform="translate(20, 20)">
      <!-- Back file -->
      <path d="M 30 25 L 75 25 L 80 30 L 80 80 L 30 80 Z" 
            fill="none" stroke="#64748b" stroke-width="6" opacity="0.5"/>
      <!-- Middle file -->
      <path d="M 35 30 L 80 30 L 85 35 L 85 85 L 35 85 Z" 
            fill="none" stroke="#94a3b8" stroke-width="6" opacity="0.7"/>
      <!-- Front file -->
      <path d="M 40 35 L 90 35 L 90 90 L 40 90 Z" 
            fill="none" stroke="#ffffff" stroke-width="7"/>
      <path d="M 75 35 L 90 35 L 75 20 Z" fill="#ffffff"/>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(95, 95)">
      <circle cx="0" cy="0" r="16" fill="url(#accent)"/>
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M -7 0 L 7 0"/>
        <polyline points="3,-4 7,0 3,4"/>
      </g>
    </g>
  </g>
  
  <!-- Text -->
  <text x="210" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="90" font-weight="700" fill="#e2e8f0" letter-spacing="-2px">eznit</text>
  <text x="210" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="3px">SELF-HOSTED STORAGE</text>
</svg>
