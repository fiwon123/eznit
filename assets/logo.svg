<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Main icon group -->
  <g filter="url(#shadow)">
    <!-- Back file/document -->
    <path d="M 168 176 L 288 176 L 304 192 L 304 312 L 168 312 Z" 
          fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    
    <!-- Middle file/document -->
    <path d="M 184 192 L 304 192 L 320 208 L 320 328 L 184 328 Z" 
          fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <!-- Front file/document -->
    <path d="M 200 208 L 336 208 L 336 344 L 200 344 Z" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- File fold/corner -->
    <path d="M 304 208 L 336 208 L 304 176 Z" 
          fill="#ffffff"/>
    
    <!-- EZ setup arrow - represents easy transfer/setup -->
    <g>
      <circle cx="316" cy="304" r="48" fill="url(#accent)"/>
      <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 296 304 L 336 304"/>
        <polyline points="322,290 336,304 322,318"/>
      </g>
    </g>
  </g>
</svg>
