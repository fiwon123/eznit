name: Release

# Publishes the downloadable archives on a `v*` tag.
#
# Policy (`.opencode/instructions/workflow.md`, step 7): the tag must point at a
# commit that is on `main`. A tag cut from a side branch fails this run instead
# of shipping an unreleased commit.
#
# The archives come from `make release`, the same target a developer runs, so
# the release artifacts and the documented build cannot drift into two different
# packaging stories. `make release` also verifies each archive it writes, and
# `PROVENANCE_COMMIT` makes it fail when a binary was built from another
# revision or a modified tree.
#
# Five gates before anything is published:
#
#   guard   the tag is on main, and the version/commit are resolved once
#   build   the twelve cgo-free archives plus checksums.txt, read-only
#   gui     eznit-gui for every platform: native runners for Linux amd64 and
#           both macOS targets, mingw for Windows amd64, and fyne-cross for the
#           two arm64 targets -- Fyne needs cgo, so it is not a cross-compile
#   pack    add the window and its licences to each CLI archive, verify every
#           archive (PE, Mach-O, provenance), and regenerate checksums.txt
#   smoke   the Windows CLI and the window are started on windows-latest
#
# `publish` needs all of them and runs only on a tag push. `workflow_dispatch`
# runs guard/build/gui/pack/smoke, keeps the archives on the run, and publishes
# nothing -- the way to exercise this pipeline without a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default token for every job is read-only; only `publish` asks for write.
permissions:
  contents: read

jobs:
  guard:
    name: Resolve the tag and its commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag points at a commit; `git describe` and the main guard both
          # need the history and tags, so a shallow clone would not do.
          fetch-depth: 0

      # A tag on a side branch would publish a commit that never passed the
      # release pull request. Refusing here makes the mistake loud instead of
      # shipping it.
      - name: Refuse a tag that is not on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main"

      - name: Resolve the version and the commit
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="$GITHUB_REF_NAME"
            commit="$GITHUB_SHA"
          else
            # A dispatch has no tag to name the run. `git describe` gives the
            # nearest tag and the distance from it, which tells two dry runs
            # apart; the commit is the checked-out head.
            version="$(git describe --tags --always)"
            commit="$(git rev-parse HEAD)"
          fi
          version="${version//\//-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build the archives
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Same pin the Go gate uses: go.mod, not a second copy here.
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # mise.toml holds the pin, exactly as in ci.web.yml.
          node-version-file: 'mise.toml'
          cache: npm
          cache-dependency-path: 'web/package-lock.json'

      - name: Install the web dependencies
        run: npm ci
        working-directory: web

      - name: Build the archives
        env:
          # `make verify-release` fails the build when a binary reports another
          # revision, or a modified tree.
          PROVENANCE_COMMIT: ${{ needs.guard.outputs.commit }}
        run: make release VERSION="${{ needs.guard.outputs.version }}"

      - name: Upload the archives to the run
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: build/dist/*
          if-no-files-found: error

  gui:
    name: Build eznit-gui ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest,  method: native }
          - { goos: linux,   goarch: arm64, runner: ubuntu-latest,  method: fyne-cross, target: linux }
          - { goos: windows, goarch: amd64, runner: ubuntu-latest,  method: mingw }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest,  method: fyne-cross, target: windows }
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel, method: native }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,   method: native }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install the Linux GUI headers
        if: matrix.method == 'native' && matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install the mingw cross compiler
        if: matrix.method == 'mingw'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip

      - name: Install fyne-cross
        if: matrix.method == 'fyne-cross'
        run: go install github.com/fyne-io/fyne-cross@v1.6.3

      - name: Build (native runner)
        if: matrix.method == 'native'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "out/gui-${GOOS}-${GOARCH}"
          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -tags fyne -trimpath \
            -ldflags "-X main.Version=${VERSION}" \
            -o "out/gui-${GOOS}-${GOARCH}/eznit-gui" ./cmd/gui

      - name: Build (mingw, Windows amd64)
        if: matrix.method == 'mingw'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out/gui-windows-amd64

          # The icon and the version block are a .syso beside the package; it
          # is generated for this build and removed afterwards.
          GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" CGO_ENABLED=0 \
            go run ./internal/tools/winres -icon assets/logo.png \
              -out cmd/gui/rsrc_windows_amd64.syso -arch amd64 \
              -name eznit-gui -description "eznit desktop app" -company eznit \
              -app-id com.fiwon123.eznit.gui -version "$VERSION"
          trap 'rm -f cmd/gui/rsrc_windows_amd64.syso' EXIT

          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build -tags fyne -trimpath \
              -ldflags "-H windowsgui -X main.Version=$VERSION" \
              -o out/gui-windows-amd64/eznit-gui.exe ./cmd/gui

          # The mingw link must stay on msvcrt, the runtime every Windows has;
          # the UCRT API sets are the heap of small DLLs a machine can miss.
          if command -v x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            if x86_64-w64-mingw32-objdump -p out/gui-windows-amd64/eznit-gui.exe | grep -q 'api-ms-win-crt'; then
              echo "::error::eznit-gui.exe imports the UCRT API sets; the cross-link must stay on msvcrt"
              exit 1
            fi
            if ! x86_64-w64-mingw32-objdump -p out/gui-windows-amd64/eznit-gui.exe | grep -q 'msvcrt.dll'; then
              echo "::error::eznit-gui.exe does not import msvcrt.dll; the cross-link changed runtime"
              exit 1
            fi
          fi

          go run ./internal/tools/winres -verify out/gui-windows-amd64/eznit-gui.exe

      - name: Build (fyne-cross)
        if: matrix.method == 'fyne-cross'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          # The fyne-cross image ships an older Go than go.mod requires;
          # GOTOOLCHAIN=auto lets the container fetch the pinned toolchain.
          #
          # -X=importpath.name=value is one token, which is what fyne-cross
          # forwards intact (a space splits it and the linker refuses).
          "$(go env GOPATH)/bin/fyne-cross" ${{ matrix.target }} \
            -arch ${{ matrix.goarch }} \
            -env GOTOOLCHAIN=auto \
            -name eznit-gui \
            -app-id com.fiwon123.eznit \
            -tags fyne \
            -icon assets/logo.png \
            -ldflags "-X=main.Version=$VERSION" \
            ./cmd/gui

          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi

          mkdir -p "out/gui-${{ matrix.goos }}-${{ matrix.goarch }}"

          # fyne-cross leaves the raw binary in bin/ for some targets and only
          # the packaged archive in dist/ for others; accept either.
          # fyne-cross names the binary after the package directory (`gui`);
          # -name only names the packaged app. Accept either.
          binary="$(find fyne-cross/bin -maxdepth 4 -type f \
            \( -name 'eznit-gui*' -o -name 'gui' -o -name 'gui.exe' \) \
            ! -name '*.tar.*' ! -name '*.zip' | head -1)"

          if [ -z "$binary" ]; then
            packaged="$(find fyne-cross/dist -type f \
              \( -name 'eznit-gui*.tar.xz' -o -name 'eznit-gui*.tar.gz' -o -name 'eznit-gui*.zip' \) \
              | head -1)"
            test -n "$packaged"

            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT

            case "$packaged" in
            *.zip) unzip -q "$packaged" -d "$work" ;;
            *.tar.xz) tar -xJf "$packaged" -C "$work" ;;
            *.tar.gz) tar -xzf "$packaged" -C "$work" ;;
            esac

            binary="$(find "$work" -type f \
              \( -name 'eznit-gui*' -o -name 'gui' -o -name 'gui.exe' \) \
              ! -name '*.tar.*' ! -name '*.zip' | head -1)"
          fi

          if [ -z "$binary" ]; then
            echo "::error::fyne-cross produced no eznit-gui binary"
            find fyne-cross -type f | head -20
            exit 1
          fi

          cp "$binary" "out/gui-${{ matrix.goos }}-${{ matrix.goarch }}/eznit-gui${ext}"

      - name: Show the tree state after the build
        if: matrix.method == 'fyne-cross'
        run: |
          git status --porcelain
          echo "--- ignored ---"
          git status --porcelain --ignored | head -30
          echo "--- inside the build container ---"
          docker run --rm -v "$PWD:/app" -w /app fyneio/fyne-cross-images:linux \
            sh -c 'git status --porcelain; echo "[ignored]"; git status --porcelain --ignored | head -20' || true

      - name: Upload the window
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/gui-${{ matrix.goos }}-${{ matrix.goarch }}/eznit-gui*
          if-no-files-found: error

  pack:
    name: Pack the window into the archives
    needs: [guard, build, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download the cgo-free archives
        uses: actions/download-artifact@v8
        with:
          name: archives
          path: dist

      - name: Download the window builds
        uses: actions/download-artifact@v8
        with:
          # One directory per artifact — guis/gui-linux-amd64/eznit-gui — so
          # the six binaries cannot overwrite each other and the packer knows
          # which platform each one is.
          pattern: gui-*
          path: guis

      - name: Add the window to each CLI archive
        run: scripts/pack-gui.sh dist guis

      - name: Verify every archive
        env:
          PROVENANCE_COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir -p verify/cli verify/server
          for archive in dist/*-cli_*; do ln "$archive" verify/cli/; done
          for archive in dist/*-server_*; do ln "$archive" verify/server/; done

          host="GOOS=$(go env GOHOSTOS) GOARCH=$(go env GOHOSTARCH) CGO_ENABLED=0"
          env $host go run ./internal/tools/winres -verify-archives verify/cli \
            -app eznit -short ez -gui \
            -files README.md,LICENSE,LICENSE-FYNE,LICENSE-APACHE,NOTICE \
            -commit "$PROVENANCE_COMMIT"
          env $host go run ./internal/tools/winres -verify-archives verify/server \
            -app eznit-server \
            -files README.md,LICENSE,RUNNING.md,docker-compose.yml \
            -commit "$PROVENANCE_COMMIT"

      - name: Regenerate the checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Upload the packed archives
        uses: actions/upload-artifact@v7
        with:
          name: archives-packed
          path: dist/*
          if-no-files-found: error

  smoke:
    name: Windows smoke test
    # A download that will not start is the failure this job exists to catch,
    # and it is invisible from the build: the exe can be the wrong subsystem or
    # miss a runtime. Run it, on the OS it was built for.
    needs: [guard, pack]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          name: archives-packed
          path: smoke

      - name: Run the binaries a user downloads
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Get-ChildItem smoke -Recurse -Filter 'eznit-cli_*_windows_amd64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'the windows/amd64 CLI archive is missing from the artifact' }

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath smoke\extracted -Force
          $cli = Get-ChildItem smoke\extracted -Recurse -Filter 'eznit.exe' | Select-Object -First 1
          $alias = Get-ChildItem smoke\extracted -Recurse -Filter 'ez.exe' | Select-Object -First 1
          if (-not $cli) { throw 'eznit.exe is missing from the archive' }
          if (-not $alias) { throw 'ez.exe is missing from the archive' }

          $reported = (& $cli.FullName -v | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "eznit.exe -v exited $LASTEXITCODE" }
          if (-not $reported.Contains($env:VERSION)) {
            throw "eznit.exe -v printed '$reported', expected $env:VERSION"
          }

          & $alias.FullName -v | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ez.exe -v exited $LASTEXITCODE" }

          # --help exits before the toolkit starts, so this proves the loader
          # takes the window (subsystem, icon resources) without a GPU.
          $gui = Get-ChildItem smoke\extracted -Recurse -Filter 'eznit-gui.exe' | Select-Object -First 1
          if (-not $gui) { throw 'eznit-gui.exe is missing from the archive' }
          $window = Start-Process $gui.FullName -ArgumentList '--help' -PassThru
          if (-not $window.WaitForExit(60000)) {
            $window.Kill()
            throw 'eznit-gui.exe --help did not exit within 60 s'
          }
          if ($window.ExitCode -ne 0) { throw "eznit-gui.exe --help failed (exit $($window.ExitCode))" }

          Write-Host "smoke ok: $reported; the window starts"

  publish:
    name: Publish the release
    needs: [guard, pack, smoke]
    # A dry run builds and smokes; only a tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes; everything above read the repository.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          name: archives-packed
          path: assets

      # The archives were hashed when they were built. Re-hash the copy that is
      # about to be uploaded: a truncated artifact would otherwise publish
      # under a checksum file that still names the good one.
      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd assets
          if [ ! -f checksums.txt ]; then
            echo "::error::checksums.txt is missing from the artifacts"
            exit 1
          fi
          sha256sum -c checksums.txt
          echo "archives: $(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)"

      - name: Compose the release description
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          cat > header.md <<'EOF'
          ## 📦 eznit @VERSION@

          Self-hosted file storage: the API, the CLI and the web UI. Built from
          `@COMMIT@` · [workflow run](@RUN@)

          ## 📦 Download

          Each archive extracts into one folder named after it. The platform is
          in the archive name; the binaries inside are plain.

          | | CLI | Server bundle |
          |:--:|---|---|
          | 🐧 amd64 | `eznit-cli_@VERSION@_linux_amd64.tar.gz` | `eznit-server_@VERSION@_linux_amd64.tar.gz` |
          | 🐧 arm64 | `eznit-cli_@VERSION@_linux_arm64.tar.gz` | `eznit-server_@VERSION@_linux_arm64.tar.gz` |
          | 🪟 amd64 | `eznit-cli_@VERSION@_windows_amd64.zip` | `eznit-server_@VERSION@_windows_amd64.zip` |
          | 🪟 arm64 | `eznit-cli_@VERSION@_windows_arm64.zip` | `eznit-server_@VERSION@_windows_arm64.zip` |
          | 🍎 amd64 | `eznit-cli_@VERSION@_darwin_amd64.tar.gz` | `eznit-server_@VERSION@_darwin_amd64.tar.gz` |
          | 🍎 arm64 | `eznit-cli_@VERSION@_darwin_arm64.tar.gz` | `eznit-server_@VERSION@_darwin_arm64.tar.gz` |

          The CLI archive carries `eznit`, `ez`, `eznit-gui` and the licences.
          The server bundle carries
          `eznit-server`, the migrations, the Compose services and
          `RUNNING.md`, which says what runs from it and what does not.

          ## ✅ Verify

          ```sh
          sha256sum -c checksums.txt        # macOS: shasum -a 256 -c checksums.txt
          ```

          ## ⚠️ What this build does not do

          - It does not run the API against a database, and it does not run the
            migrations. `RUNNING.md` and the known gaps in the repository say
            what that leaves unproven.
          - The macOS and ARM64 archives are cross-compiled on Linux and never
            executed. Only the Windows amd64 CLI is started by this workflow.

          <details>
          <summary>🧾 Merged pull requests</summary>

          EOF

          sed -i "s|@VERSION@|$VERSION|g; s|@COMMIT@|$COMMIT|g; s|@RUN@|$RUN_URL|g" header.md

          if grep -nE '@[A-Z_]+@' header.md; then
            echo "::error::header.md still carries an unsubstituted placeholder"
            exit 1
          fi

          set +e
          stray="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' header.md | grep -vxF -e "$VERSION")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] && [ -n "$stray" ]; then
            echo "::error::a release version is typed into the header: $(printf '%s\n' "$stray" | sort -u | tr '\n' ' ')— use @VERSION@"
            exit 1
          fi

          # The changelog is built from the PRs merged into `dev`: every feature
          # PR is squash-merged, so `--generate-notes` would see the release
          # commit and miss them. The first release has no previous published
          # release to bound the window, so it falls back to a commit pointer.
          if ./scripts/release-notes.sh "$REPO" "$VERSION" "$COMMIT" > changes.md 2>release-notes.err; then
            :
          else
            echo "::warning::release-notes.sh could not build the PR list; shipping a commit pointer"
            sed 's/^/  /' release-notes.err >&2
            printf '_The pull-request list was unavailable for %s. See the commits:\n%s/commits/%s_\n' \
              "$VERSION" "${GITHUB_SERVER_URL:-https://github.com}/$REPO" "$COMMIT" > changes.md
          fi

          { cat header.md; cat changes.md; printf '\n</details>\n'; } > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          mapfile -t files < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums.txt' \) -printf '%f\n' | sort)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::expected the archives and checksums.txt, found ${#files[@]} file(s)"
            exit 1
          fi
          echo "uploading ${#files[@]} assets"
          gh release create "$TAG" "${files[@]}" \
            --verify-tag \
            --title "eznit $TAG" \
            --notes-file ../release-notes.md

# WHAT THIS DOES NOT PROVE: `publish` runs only on a tag push, so a green
# `workflow_dispatch` run verifies the build, the packaging, the checksums and
# the Windows smoke test -- not `gh release create`. Until a real tag runs that
# step, the publication path is unverified, and a skipped job is not a passed
# job.
