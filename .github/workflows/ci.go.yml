name: CI (Go)

# Go CI for this repository. Standard toolchain only: gofmt, go vet, go test,
# go build -- no third-party linters, so it runs on any Go project unchanged.
# `go.sum` is the lockfile; `go` downloads exactly what it pins, so there is no
# separate locked-install step to get wrong.
#
# It runs on release pull requests (`dev` -> `main`) and on manual dispatch --
# never on a feature-branch pull request. Feature branches are gated locally by
# `make check`.
#
# No database, no container, no secret file. The API talks to PostgreSQL at
# runtime, but this gate compiles it and lints it -- it never starts it. A
# change that breaks the API's behaviour against a real database is therefore
# NOT covered here; see the comment at the bottom.

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    # The job name is the status check's name. Without an explicit one
    # it defaults to the job id, 'go' -- and a required status check that
    # names 'CI (Go)' would never match it, leaving every release pull
    # request blocked forever with no failing check to show for it.
    name: CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `go-version-file` keeps CI and local development on the same
          # toolchain. Pin the version in go.mod, not in two places.
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      # Reachable-vulnerability gate. The default (symbol-level) scan fails
      # only when this code actually reaches a vulnerable function; findings
      # that exist only in a required module do not fail it. That distinction
      # is deliberate:
      #
      #   - `-scan=module` can never be green here: GO-2026-5932 is
      #     "Fixed in: N/A" (x/crypto's unmaintained openpgp package, which
      #     this repository does not import) and x/crypto cannot be dropped
      #     because `bcrypt` comes from it.
      #   - A red symbol-level run means something reachable regressed, which
      #     is the actionable signal.
      #
      # Baseline when this step landed (Go 1.27.3, chi v5.5.0):
      #   0 reachable findings, 1 module-level (the openpgp entry above).
      #
      # The tool is pinned so a new release cannot change the verdict on an
      # unchanged tree; the vulnerability database is fetched fresh, so a new
      # advisory against code that is still called will (correctly) fail.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

# A `paths:` filter that the change does not touch means this workflow does not
# trigger at all, and a triggered run whose jobs are all gated out reports
# `skipped`, not `passed`. Skipped is not passed: run `make check` locally
# before relying on CI.
#
# TWO LIMITS TO KNOW ABOUT:
#
# 1. THE TEST SUITE IS PARTIAL. Packages with tests run them; the rest print
#    "[no test files]" and still exit 0, so a green `Test` step means "the
#    packages with tests passed and the rest compiled" -- not full coverage.
#    `make check` prints the list of uncovered packages for the same reason.
#    The vulnerability scan is symbol-level, so it is only as complete as the
#    call graph it can see; code behind an interface it cannot resolve may be
#    missed.
# 2. NOTHING HERE EXERCISES THE API AGAINST A DATABASE. The API compiles and
#    vets, but no request is ever made to it and no migration is ever run.
#    A green run says nothing about whether a query still matches a schema.
#
# Read the run's log before treating a green build as coverage.
