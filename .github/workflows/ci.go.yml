name: CI (Go)

# Go CI for this repository. Standard toolchain only: gofmt, go vet, go test,
# go build -- no third-party linters, so it runs on any Go project unchanged.
# `go.sum` is the lockfile; `go` downloads exactly what it pins, so there is no
# separate locked-install step to get wrong.
#
# It runs on release pull requests (`dev` -> `main`) and on manual dispatch --
# never on a feature-branch pull request. Feature branches are gated locally by
# `make check`.
#
# The unit suite needs no database, no container and no secret file: the API
# talks to PostgreSQL at runtime, but the unit gate compiles it and lints it --
# it never starts it. A second step in the same job DOES start a PostgreSQL
# service and runs the `integration`-tagged suite (`make test_integration`
# locally), because a query that only fails against a real schema would
# otherwise reach `main` unverified.

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    # The job name is the status check's name. Without an explicit one
    # it defaults to the job id, 'go' -- and a required status check that
    # names 'CI (Go)' would never match it, leaving every release pull
    # request blocked forever with no failing check to show for it.
    name: CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      # The database the integration step runs against. The unit `Test` step
      # does not talk to it: `go test ./...` has no `integration` tag, so the
      # suite that needs a schema is not compiled there.
      postgres:
        # The same tag as docker-compose.yml, so CI and the product run the
        # same PostgreSQL.
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eznit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eznit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `go-version-file` keeps CI and local development on the same
          # toolchain. Pin the version in go.mod, not in two places.
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The same commands as `make test_integration`: the migrations run up and
      # down and every repository is exercised against the real schema. A
      # failure here is a query that does not match the database, which the
      # unit step cannot see.
      - name: Integration (live PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eznit_test?sslmode=disable
        run: |
          go vet -tags=integration ./...
          go test -tags=integration -count=1 -p 1 ./...

      - name: Build
        run: go build ./...

      # Reachable-vulnerability gate. The default (symbol-level) scan fails
      # only when this code actually reaches a vulnerable function; findings
      # that exist only in a required module do not fail it. That distinction
      # is deliberate:
      #
      #   - `-scan=module` can never be green here: GO-2026-5932 is
      #     "Fixed in: N/A" (x/crypto's unmaintained openpgp package, which
      #     this repository does not import) and x/crypto cannot be dropped
      #     because `bcrypt` comes from it.
      #   - A red symbol-level run means something reachable regressed, which
      #     is the actionable signal.
      #
      # Baseline when this step landed (Go 1.27.4, chi v5.5.0):
      #   0 reachable findings, 1 module-level (the openpgp entry above).
      #
      # The tool is pinned so a new release cannot change the verdict on an
      # unchanged tree; the vulnerability database is fetched fresh, so a new
      # advisory against code that is still called will (correctly) fail.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

# A `paths:` filter that the change does not touch means this workflow does not
# trigger at all, and a triggered run whose jobs are all gated out reports
# `skipped`, not `passed`. Skipped is not passed: run `make check` locally
# before relying on CI.
#
# TWO LIMITS TO KNOW ABOUT:
#
# 1. THE TEST SUITE IS PARTIAL. Packages with tests run them; the rest print
#    "[no test files]" and still exit 0, so a green `Test` step means "the
#    packages with tests passed and the rest compiled" -- not full coverage.
#    `make check` prints the list of uncovered packages for the same reason.
#    The vulnerability scan is symbol-level, so it is only as complete as the
#    call graph it can see; code behind an interface it cannot resolve may be
#    missed.
# 2. THE INTEGRATION STEP COVERS THE SCHEMA, NOT THE ROUTES. It starts a real
#    PostgreSQL, applies and reverses every migration, and runs each repository
#    against it. No HTTP request is made to the API, so a handler that reads
#    the right row and writes the wrong status is still invisible here.
#
# The unit `Test` step still runs without a database; only the integration step
# starts the service. Read the run's log before treating a green build as
# coverage.
