# The application and the dev sandbox — one file, no host prerequisites.
#
# Two entry points, one stack:
#
#   docker compose up   the product: PostgreSQL, the migrations, the API on
#                       :4000, and the web UI served by nginx on :5173. The
#                       UI proxies /v1 to the API (one origin), so the API
#                       keeps its session and download flows unchanged.
#
#   make dev-up         the developer loop: PostgreSQL, the migrations, the
#                       sandbox where `make run_api`, `make check` and
#                       `make dev-opencode` run against the source, and the
#                       `web-dev` Vite server for the UI. The API runs in the
#                       sandbox and the UI on 5173 proxies /v1 to it, so the
#                       loop needs no host Go or Node install. The `dev` and
#                       `web-dev` services are behind the `dev` profile; naming
#                       one on the command line enables that profile.
#
# Every host-derived value below has an inline default, so nothing has to be
# exported first. The two local files (`make setup` creates them) still have to
# exist: the database password is a file secret, not an environment value.
#
# Host-only mounts (the gh/opencode config dirs, `~/.gitconfig`) deliberately do
# NOT live here. Compose treats a missing bind-mount source as fatal on Windows
# and creates a root-owned directory for it on Linux, so a single absent
# `~/.config/gh` would break the one command this file exists to support. They
# live in `docker-compose.agent.yml`, merged only by the developer entry points
# and only when the host can actually provide them.
#
# A release bundle has no source and no Dockerfile: it runs the PREBUILT binary
# from ./build instead of the `api` service below. `docker compose up db
# migrate` never builds anything, and the binary serves the UI embedded in it.

name: eznit

services:
  dev:
    # The developer sandbox only. Plain `docker compose up` is the product
    # (`api` + `db` + `migrate`); the sandbox is opt-in because it is a shell
    # for a pinned toolchain, not the application. `make dev-up` names this
    # service, and Compose enables the profile of an explicitly named service.
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    # Host identity defaults to UID/GID 1000, which is correct for Docker
    # Desktop (macOS/Windows virtualise bind-mount ownership). A Linux user
    # whose uid differs overrides it:
    # `HOST_UID="$(id -u)" docker compose up dev db migrate`.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    extra_hosts:
      # Docker Desktop injects this name itself; plain Linux Docker does not,
      # so it is declared for both.
      - "host.docker.internal:host-gateway"
    # Invoked through bash rather than executed directly: a Windows checkout
    # does not preserve the executable bit through a bind mount, so running the
    # path itself fails with "Permission denied". This also makes the LF policy
    # in .gitattributes a redundancy rather than a hard requirement here.
    command: ["/bin/bash", "/workspace/scripts/dev-entrypoint.sh"]
    # The API listens on 4000 inside the container (hardcoded in cmd/api), and
    # the host-side CLI talks to `http://localhost:4000` by default — so
    # publishing 4000 makes the CLI work against the sandboxed API with no
    # configuration at all. Override the host port when the API runs on the
    # host instead, which would otherwise collide: `HOST_PORT=4001`.
    ports:
      - "${HOST_PORT:-4000}:4000"
    environment:
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HOME=/home/devuser
      # Forwarded so the entrypoint can probe ownership and the compose
      # interpolation above has something to fall back to.
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # The API reads its database settings from the environment. Inside the
      # sandbox the database is the `db` service on the compose network, so
      # these are the in-network address — NOT the host port the database is
      # published on. They are set explicitly because `env_file` below can
      # carry a host-side DB_PORT, which would point the API at a port that
      # does not exist inside the network.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-root}
      - DB_NAME=${DB_NAME:-eznit}
      # The password stays a file secret, the same way the API container reads
      # it — never an environment variable.
      - DB_PASSWORD_FILE=/run/secrets/db_password
      # One frontend origin, like the product: the UI is the `web-dev` service
      # (Vite, with hot reload) and :4000 stays the API only. Left to .env, the
      # sandbox would also serve a stale web/dist build on 4000, so the browser
      # could talk to two different UIs depending on the port it opened.
      - API_SERVE_WEB=false
      # Tells the Makefile inside the container not to import the host's .env
      # over the configuration below (see the top of the Makefile). Without it,
      # a host-side `DB_HOST="localhost"` wins and the API never finds the
      # database on the Compose network.
      - DEV_SANDBOX=1
    # The local configuration, when it exists: API_UPLOADS and API_LOGS are
    # relative paths, so they resolve inside the bind mount and the files are
    # the ones the host sees. `required: false` keeps a clean clone loadable —
    # the sandbox must come up even before the configuration exists.
    env_file:
      - path: ./.env
        required: false
    secrets:
      - db_password
    # The sandbox is configured to talk to the `db` service, so compose starts
    # the database with it — and waits for it. The database has a healthcheck
    # and the migration is a one-shot service, so the real sequence can be
    # expressed: database healthy, then migration finished, then the sandbox.
    # Without this, `docker compose up dev` starts against no database, and
    # the paths that do start the database start the sandbox in parallel with
    # the migration.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # The workspace bind mount is the only mount in this file: it exists on
      # every platform and needs no host setup.
      - .:/workspace:cached
      # The Go module cache and build cache live OUTSIDE the bind mount, in the
      # image's own filesystem. Without these volumes every rebuild re-downloads
      # the whole dependency set and re-compiles the standard library.
      - gomodcache:/go/pkg/mod
      - gocache:/home/devuser/.cache/go-build
    tty: true
    stdin_open: true

  db:
    image: postgres:18.3-bookworm
    restart: always
    environment:
      # Inline defaults, so the file loads on a clean clone with no .env file.
      # Compose reads .env itself for the interpolation, so a configured
      # checkout still gets its own values.
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-eznit}
    secrets:
      - db_password
    ports:
      # The host port is overridable, so two checkouts can run side by side.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 10

  migrate:
    image: migrate/migrate:4
    # The local configuration, when it exists. `required: false` keeps a clean
    # clone loadable: the service reports a clear error of its own if the
    # variables it needs are missing, which beats the whole project refusing
    # to load.
    env_file:
      - path: ./.env
        required: false
    # `environment` wins over `env_file`, and deliberately here: inside the
    # compose network the database is always on 5432, whatever host port it is
    # published on. The migration DSN is built from these variables, so a host
    # port override must not reach it.
    environment:
      DB_USER: ${DB_USER:-root}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-eznit}
    secrets:
      - db_password
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/run_migrate.sh:/scripts/run_migrate.sh:ro
    entrypoint: ["/scripts/run_migrate.sh"]
    command: []
    # A one-shot, not a service: `up` starts it, it applies what is missing
    # (`migrate up` is idempotent) and exits 0. The API waits for that exit, so
    # a failed migration leaves the API down instead of running it against an
    # unmigrated schema.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    # The frontend. It builds its own image from web/Dockerfile (Node builds
    # the UI, nginx serves it), and proxies /v1 to the API — so the browser sees
    # one origin on 5173. Set API_SERVE_WEB=false on the API when using this
    # service so :4000 stays the API only.
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web-dev:
    # The developer frontend: the Vite dev server, not the nginx image the
    # product builds. It exists for the same reason the sandbox does — so the
    # loop needs no toolchain on the host — and it gives the UI hot reload,
    # which a static nginx image cannot.
    #
    # It is a separate service rather than a second process inside `dev` so the
    # two have independent logs, lifetimes and exits. `make dev-up` starts both.
    profiles: ["dev"]
    build:
      context: .
      dockerfile: web/Dockerfile.dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # The host port the browser opens. Override it when 5173 is taken; the
      # HMR client port follows automatically (see the environment below).
      - "${WEB_PORT:-5173}:5173"
    environment:
      # npm and Vite both want a writable HOME. The image's own account is not
      # necessarily the host uid, and /tmp is writable by every uid.
      - HOME=/tmp
      # Inside the Compose network the API is the `dev` service, not loopback:
      # `make run_api` listens on 4000 there. Vite's proxy uses this.
      - VITE_API_TARGET=http://dev:4000
      # The websocket the browser opens points at the host port, which is not
      # the container port when WEB_PORT is overridden.
      - VITE_HMR_CLIENT_PORT=${WEB_PORT:-5173}
    volumes:
      # The source, so an edit on the host reloads the browser.
      - .:/workspace:cached
      # Dependencies live in a named volume, NOT in the bind mount: the host's
      # node_modules are installed for the host Node, and sharing them would
      # mix two toolchains. The image pre-creates this path so Docker does not
      # create it root-owned (see web/Dockerfile.dev).
      - web_node_modules:/workspace/web/node_modules
    depends_on:
      # The proxy target is the sandbox API, so starting the UI before it only
      # produces connection errors in the browser.
      dev:
        condition: service_started
    restart: unless-stopped

  api:
    # The application. It builds its own image, so `docker compose up` needs
    # Docker and nothing else -- no Go, no Node, no prebuilt binary.
    #
    # When the `web` service fronts it, API_SERVE_WEB=false keeps the API on
    # :4000 with no UI attached (the single origin is the web tier). The
    # released binary still serves the embedded UI by default.
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VERSION: ${VERSION:-dev}
    ports:
      # Same port the host CLI and the Vite dev server expect. Override it when
      # it is taken: `API_PORT=4001 docker compose up`.
      - "${API_PORT:-4000}:4000"
    environment:
      # In-network addresses, explicitly: `env_file` is deliberately not used
      # here. The gitignored .env belongs to the developer loop (host paths,
      # a host-tuned database port); the application container has to reach
      # the database over the compose network and keep its data on /data.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-root}
      DB_NAME: ${DB_NAME:-eznit}
      # The password stays a file secret, the same way the sandbox and the
      # migration read it -- never an environment variable.
      DB_PASSWORD_FILE: /run/secrets/db_password
      API_UPLOADS: /data/uploads
      API_LOGS: /data/logs
      # The web tier proxies /v1, so the API does not need to serve the UI.
      API_SERVE_WEB: "false"
    secrets:
      - db_password
    volumes:
      # Uploaded bytes are the product. Without this they live in the container
      # layer and disappear on `docker compose down`.
      - api-data:/data
    # Come back after a Docker restart, and after a crash, without a rebuild.
    restart: unless-stopped
    healthcheck:
      # /v1/healthcheck answers without touching the database, so this says
      # "the process answers", not "the database is up". It is what makes
      # `docker compose ps` distinguish "starting" from "serving".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/v1/healthcheck || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres-data:
  api-data:
  gomodcache:
  gocache:
  # The `web-dev` dependencies: container-installed, kept across `dev-down`, and
  # deliberately separate from the host's web/node_modules.
  web_node_modules:
