server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API keeps its own paths; uploads can be up to 32 MiB, so nginx must
    # allow a body larger than its default 1 MB.
    client_max_body_size 32m;

    # Static assets get a long cache: the build emits content-hashed names.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-asset route serves index.html for the browser
    # router. Files that exist (favicon, logo, etc.) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
