<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle/square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- File stack representation -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back file -->
    <path d="M 180 170 L 320 170 L 332 182 L 332 342 L 180 342 Z" opacity="0.6"/>
    <path d="M 192 182 L 344 182 L 356 194 L 356 354 L 192 354 Z" opacity="0.8"/>
    <!-- Front file -->
    <path d="M 204 194 L 368 194 L 368 366 L 204 366 Z"/>
    <!-- Fold -->
    <path d="M 332 194 L 368 194 L 332 158 Z" fill="#ffffff"/>
  </g>
  
  <!-- Download arrow overlay -->
  <g transform="translate(256, 280)">
    <circle cx="0" cy="0" r="48" fill="url(#accent)" opacity="0.95"/>
    <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -16 L 0 20"/>
      <polyline points="-14,6 0,20 14,6"/>
    </g>
  </g>
</svg>
