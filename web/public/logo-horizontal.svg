<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(20, 20)">
    <rect width="160" height="160" rx="36" fill="url(#bg)"/>
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(20, 20)">
      <!-- Back file -->
      <path d="M 40 30 L 90 30 L 95 35 L 95 110 L 40 110 Z" opacity="0.6"/>
      <path d="M 45 35 L 100 35 L 105 40 L 105 115 L 45 115 Z" opacity="0.8"/>
      <!-- Front file -->
      <path d="M 50 40 L 110 40 L 110 120 L 50 120 Z"/>
      <!-- Fold -->
      <path d="M 90 40 L 110 40 L 90 20 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(80, 95)">
      <circle cx="0" cy="0" r="18" fill="#60a5fa" opacity="0.95"/>
      <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 -6 L 0 8"/>
        <polyline points="-5,3 0,8 5,3"/>
      </g>
    </g>
  </g>
  
  <!-- Text -->
  <text x="210" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="700" fill="#1e40af">eznit</text>
</svg>
