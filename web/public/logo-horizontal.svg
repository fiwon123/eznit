<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(20, 20)">
    <rect width="160" height="160" rx="36" fill="url(#bg)"/>
    
    <!-- Grid pattern -->
    <g opacity="0.08" stroke="#3b82f6" stroke-width="0.8" clip-path="url(#clip)">
      <clipPath id="clip">
        <rect width="160" height="160" rx="36"/>
      </clipPath>
      <line x1="40" y1="0" x2="40" y2="160"/>
      <line x1="80" y1="0" x2="80" y2="160"/>
      <line x1="120" y1="0" x2="120" y2="160"/>
      <line x1="0" y1="40" x2="160" y2="40"/>
      <line x1="0" y1="80" x2="160" y2="80"/>
      <line x1="0" y1="120" x2="160" y2="120"/>
    </g>
    
    <!-- E logo -->
    <g transform="translate(40, 40)">
      <path d="M 0 0 L 80 0 L 80 16 L 20 16 L 20 32 L 70 32 L 70 48 L 20 48 L 20 64 L 80 64 L 80 80 L 0 80 Z" 
            fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="square" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#06b6d4"/>
      <circle cx="80" cy="0" r="3" fill="#3b82f6"/>
      <circle cx="80" cy="80" r="3" fill="#6366f1"/>
      <circle cx="0" cy="80" r="3" fill="#06b6d4"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="210" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" fill="url(#accent)" letter-spacing="-2px">eznit</text>
</svg>
